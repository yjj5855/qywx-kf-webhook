      height: 250
      id: start
      position:
        x: 0
        y: 320
      positionAbsolute:
        x: 0
        y: 320
      selected: false
      type: custom
      width: 242
      zIndex: 0
    - data:
        code: |
          import json

          # 查询类型 → 中文名（用于追问提示）
          QUERY_TYPE_NAMES = {
              "employee_info": "员工信息",
              "company_bill": "公司账单",
              "financial_data": "财务数据",
              "hr_data": "人事数据",
              "social_security_progress": "社保公积金办理进度",
          }

          # 常见中文关键词 → 查询类型（意图模型漏填时兜底识别）
          QUERY_TYPE_ALIAS = [
              ("员工", "employee_info"),
              ("账单", "company_bill"),
              ("财务", "financial_data"),
              ("人事", "hr_data"),
              ("社保", "social_security_progress"),
              ("公积金", "social_security_progress"),
              ("进度", "social_security_progress"),
          ]

          def main(query_type: str, keyword: str, period: str, spoken: str, sender_name: str = ""):
              """
              构建公司信息查询动作：参数齐全 → 交给应用层执行；否则 → 追问。
              输出契约（供主工作流/应用层解析）：
                action=company_info_query 时：reply_text 为空，应用层用群绑定 company_id 调公司接口；
                action 为空时：reply_text 为追问文本。
              params 携带 sender_name，供应用层做权限校验/审计。
              """
              qt = (query_type or "").strip().lower()
              if not qt:
                  text = (spoken or "").lower()
                  for alias, canonical in QUERY_TYPE_ALIAS:
                      if alias in text:
                          qt = canonical
                          break

              if not qt:
                  lines = "\n".join(f"{i}. {name}" for i, name in enumerate(QUERY_TYPE_NAMES.values(), 1))
                  greeting = f"{sender_name}，" if sender_name else ""
                  return {
                      "reply_text": f"{greeting}请问您要查询哪类公司信息？\n{lines}",
                      "action": "",
                      "query_type": "",
                      "keyword": "",
                      "period": "",
                      "params": "",
                  }

              params = {"query_type": qt, "keyword": keyword, "period": period, "sender_name": sender_name}
              return {
                  "reply_text": "",
                  "action": "company_info_query",
                  "query_type": qt,
                  "keyword": keyword,
                  "period": period,
                  "params": json.dumps(params, ensure_ascii=False),
              }
        code_language: python3
        outputs:
          action:
            children: null
            type: string
          keyword:
            children: null
            type: string
          params:
            children: null
            type: string
          period:
            children: null
            type: string
          query_type:
            children: null
            type: string
          reply_text:
            children: null
            type: string
        selected: false
        title: 构建公司信息查询请求
        type: code
        variables:
        - value_selector:
          - start
          - query_type
          value_type: string
          variable: query_type
        - value_selector:
          - start
          - keyword
          value_type: string
          variable: keyword
        - value_selector:
