          value_selector:
          - code_company_query
          - period
          variable: period
        - type: string
          value_selector:
          - code_company_query
          - params
          variable: params
        selected: false
        title: 结束
        type: end
      height: 88
      id: end
      position:
        x: 700
        y: 320
      positionAbsolute:
        x: 700
        y: 320
      selected: false
      type: custom
      width: 242
      zIndex: 0
