          - sender_name
          value_type: string
          variable: sender_name
      height: 52
      id: code_company_query
      position:
        x: 340
        y: 320
      positionAbsolute:
        x: 340
        y: 320
      selected: false
      type: custom
      width: 242
      zIndex: 0
    - data:
        outputs:
        - type: string
          value_selector:
          - code_company_query
          - reply_text
          variable: reply_text
        - type: string
