    - data:
        code: |
          import json

          def main(text: str) -> dict:
              """解析 LLM 输出中的 JSON，解析失败时返回 UNKNOWN 默认结构。"""
              default = {
                  "intent": "UNKNOWN",
                  "confidence": 0.0,
                  "target_person": "",
                  "target_group": "",
                  "target_phone": "",
                  "query_type": "",
                  "keyword": "",
                  "period": "",
                  "category": "UNKNOWN",
              }
              if text and "</think>" in text:
                  json_str = text.split("</think>")[-1].strip()
              else:
                  json_str = (text or "").strip()

              try:
                  obj = json.loads(json_str)
                  if not isinstance(obj, dict):
                      obj = default
                  else:
                      for k in default:
                          obj.setdefault(k, default[k])
              except Exception:
                  obj = default

              return {"obj": obj}
        code_language: python3
        outputs:
          obj:
            children: null
            type: object
        selected: false
