    - data:
        code: |-
          import json
          import re

          # 必填字段定义：(字段名, 中文名, 校验函数)
          REQUIRED_FIELDS = [
              ("company_name", "企业名称", lambda v: bool(v and v.strip())),
              ("uscc", "统一社会信用代码", lambda v: bool(re.fullmatch(r"[0-9A-Z]{18}", (v or "").strip().upper()))),
              ("legal_representative", "法定代表人", lambda v: bool(v and v.strip())),
              ("contact_phone", "经办人电话", lambda v: bool(re.fullmatch(r"1[3-9]\d{9}", (v or "").strip()))),
              ("account_type", "开户类型", lambda v: bool(v and v.strip())),
          ]

          QUESTION_MAP = {
              "company_name": "请问贵公司的企业名称是？",
              "uscc": "请问贵公司的统一社会信用代码（18位）是？",
              "legal_representative": "请问贵公司的法定代表人是谁？",
              "contact_phone": "请问经办人的联系电话（11位手机号）是？",
              "account_type": "请问需要办理哪种开户类型？（如基本户、一般户、专用户）",
          }

          def _parse_llm_output(llm_output):
              """兼容字符串（可能带思考标签）、JSON 字符串、dict。"""
              if isinstance(llm_output, dict):
                  return llm_output
              raw = str(llm_output or "").strip()
              if not raw:
                  return {}
              raw = re.sub(r"<(?:think|thinking|reasoning)>.*?</(?:think|thinking|reasoning)>", "", raw, flags=re.S | re.I)
              try:
                  return json.loads(raw)
              except (json.JSONDecodeError, ValueError):
                  m = re.search(r"\{.*\}", raw, re.S)
                  if m:
                      try:
                          return json.loads(m.group(0))
                      except (json.JSONDecodeError, ValueError):
                          return {}
              return {}

          def main(llm_output: str) -> dict:
              data = _parse_llm_output(llm_output)

              # 客户明确取消 → 只回取消话术
              if data.get("aborted"):
                  return {
                      "all_collected": False,
                      "collected_summary": "",
                      "missing_names": "",
                      "reply_text": str(data.get("next_question") or "好的，已为您取消开户办理，如后续需要可随时联系我。"),
                  }

              collected = data.get("collected") or {}
              if not isinstance(collected, dict):
                  collected = {}

              # 规范化 + 校验，缺失字段记录中文名
              normalized = {}
              missing = []
              for key, label, valid in REQUIRED_FIELDS:
                  val = str(collected.get(key) or "").strip()
                  if key == "uscc":
                      val = val.upper()
                  normalized[key] = val
                  if not valid(val):
                      missing.append(label)

              all_collected = not missing
              summary = "；".join(
                  f"{label}：{normalized[k]}" for k, label, _ in REQUIRED_FIELDS if normalized.get(k)
              )

              if not all_collected:
                  # 缺失时优先用 LLM 的追问，其次按字段顺序自动追问
                  llm_q = str(data.get("next_question") or "").strip()
                  if not llm_q or ("？" not in llm_q and "?" not in llm_q and "请提供" not in llm_q and "请问" not in llm_q):
                      first_label = missing[0]
                      first_key = next(k for k, label, _ in REQUIRED_FIELDS if label == first_label)
                      llm_q = QUESTION_MAP.get(first_key, f"请提供：{first_label}。")
                  reply = llm_q if llm_q else f"请提供：{'、'.join(missing)}。"
              else:
                  reply = f"已收到您的开户信息：{summary}。请您确认信息无误，我们马上为您整理开户材料。"

              return {
                  "all_collected": all_collected,
                  "collected_summary": summary,
                  "missing_names": "、".join(missing),
                  "reply_text": reply,
              }
        code_language: python3
        desc: ''
        isInIteration: false
        isInLoop: false
        outputs:
          all_collected:
            children: null
            type: boolean
          collected_summary:
            children: null
            type: string
          missing_names:
            children: null
            type: string
          reply_text:
