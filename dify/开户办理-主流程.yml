app:
  description: 开户办理主流程 — 独立的企业开户办理客服工作流。接收与「客服-主流程」一致的 WorkTool 回调参数， 经门控与开户意图识别后，多轮收集企业开户必填信息（企业名称/统一社会信用代码/法定代表人/经办人电话/开户类型）， 信息齐全后通过 WorkTool API（type=218）发送开户材料文件，并回答开户流程/材料咨询；回复统一经 WorkTool 发送。 适用于在群绑定表
    group_bindings.workflow_app_id 中配置了本工作流的群（其余群仍走「客服-主流程」）。
  icon: 🏦
  icon_background: '#E7F3FF'
  icon_type: emoji
  mode: workflow
  name: 开户办理-主流程
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.20@850efe73fb62bbe7ab2229116086596596297a77174fb86f73e1363b99a24116
    version: null
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables:
  - value_type: string
    id: env_api_base_url
    name: WT_API_BASE_URL
    value: https://api.worktool.ymdyes.cn
    description: WorkTool API 基础地址
    selector:
    - - env
      - WT_API_BASE_URL
  - value_type: string
    id: env_robot_id
    name: WT_ROBOT_ID
    value: wtgxpt9udc4pb4hgj0rnn139gfwcc6ls
    description: 机器人 ID
    selector:
    - - env
      - WT_ROBOT_ID
  - value_type: string
    id: env_open_account_file_url
    name: WT_OPEN_ACCOUNT_FILE_URL
    value: ''
    description: 开户材料文件的网络地址（type=218 推送任意图片/音视频/文件 使用；留空则只回复文字不发文件）
    selector:
    - - env
      - WT_OPEN_ACCOUNT_FILE_URL
  - value_type: string
    id: env_open_account_file_name
    name: WT_OPEN_ACCOUNT_FILE_NAME
    value: 开户申请材料.zip
    description: 开户材料文件名（含后缀，如 开户申请材料.zip）
    selector:
    - - env
      - WT_OPEN_ACCOUNT_FILE_NAME
  - value_type: number
    id: env_confidence_threshold
    name: CONFIDENCE_THRESHOLD
    value: 0.7
    description: 意图识别置信度阈值
    selector:
    - - env
      - CONFIDENCE_THRESHOLD
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 开户办理主流程已就绪。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
