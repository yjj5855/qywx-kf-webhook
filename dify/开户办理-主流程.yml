    - data:
        code: |-
          import json
          import re

          def main(llm_output, confidence_threshold: float):
              """解析开户意图 LLM 返回的 JSON，校验置信度阈值，输出意图。

              llm_output 可能是 JSON 字符串（可能带思考标签），也可能是已解析的 dict。
              """
              default = {"intent": "OTHER", "confidence": 0.0, "reason": ""}

              if not llm_output:
                  return default

              try:
                  if isinstance(llm_output, dict):
                      data = llm_output
                  else:
                      raw = str(llm_output)
                      raw = re.sub(r"<(?:think|thinking|reasoning)>.*?</(?:think|thinking|reasoning)>", "", raw, flags=re.S | re.I)
                      data = json.loads(raw.strip())
                  if not isinstance(data, dict):
                      data = default

                  intent_str = str(data.get("intent", "OTHER")).upper().strip()
                  try:
                      confidence = float(data.get("confidence", 0.0) or 0.0)
                  except (TypeError, ValueError):
                      confidence = 0.0
                  reason = str(data.get("reason", ""))

                  # 置信度低于阈值 → OTHER
                  if confidence < confidence_threshold:
                      return default

                  # 兼容别名，统一意图名
                  if intent_str in ("OPEN_ACCOUNT_INFO", "ACCOUNT_OPENING", "APPLY_OPEN"):
                      intent_str = "OPEN_ACCOUNT"
                  if intent_str in ("OPEN_ACCOUNT_QUESTION", "OPEN_QA", "QA"):
                      intent_str = "OPEN_ACCOUNT_QA"
                  if intent_str not in ("OPEN_ACCOUNT", "OPEN_ACCOUNT_QA", "OTHER"):
                      intent_str = "OTHER"

                  return {"intent": intent_str, "confidence": min(max(confidence, 0.0), 1.0), "reason": reason}
              except (json.JSONDecodeError, ValueError, TypeError):
                  # 降级：纯文本关键词匹配
                  text_upper = str(llm_output).strip().upper()
                  if "开户" not in text_upper:
                      return default
                  if any(k in text_upper for k in ("我要开", "想开", "办理", "申请开户", "帮我开", "开个户", "怎么开", "如何开")):
                      return {"intent": "OPEN_ACCOUNT", "confidence": 0.9, "reason": "关键词匹配"}
                  return {"intent": "OPEN_ACCOUNT_QA", "confidence": 0.8, "reason": "关键词匹配"}
