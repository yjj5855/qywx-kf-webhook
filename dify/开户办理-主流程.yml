    - data:
        code: |-
          import json
          import re

          def main(text: str) -> dict:
              # 方法1：先提取 </think> 之后的内容
              match = re.search(r'</think>\s*(\{.*\})', text, re.DOTALL)
              if match:
                  try:
                      return json.loads(match.group(1))
                  except Exception:
                      return {"real_question": "", "should_reply": False, "reason": "解析失败"}
              # 方法2：直接找最外层的 JSON（非贪婪匹配，但要注意嵌套）
              match = re.search(r'\{[^{}]*\}', text)
              if match:
