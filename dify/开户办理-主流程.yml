    - data:
        code: |-
          def main(
              spoken: str,
              rawSpoken: str,
              receivedName: str,
              groupName: str,
              groupRemark: str,
              roomType: int,
              atMe,
              textType: int,
              fileBase64: str,
              messageId: str,
          ):
              # 是否群聊 (roomType 1=外部群 3=内部群)
              is_group = roomType in (1, 3)

              # 是否被 @
              at_me = str(atMe).lower() in ("true", "1", "yes")

              # 是否是图片消息
              is_image = textType == 2

              # 不支持的媒体类型：0=未知 3=语音 5=视频 7=小程序 8=链接 9=文件
              # （1=文本 2=图片 13=合并记录 15=带回复文本 视为可处理）
              is_unsupported = textType not in (1, 2, 13, 15)

              # 会话标识：群聊用群备注/群名，单聊用联系人名称
              chat_id = (groupRemark or groupName) if is_group else receivedName
              session_id = f"{roomType}:{chat_id}"

              # 门控消息文本：图片时用占位
              gate_msg = spoken or ("[图片]" if is_image else "")

              # 场景描述
              scene_map = {1: "外部群", 2: "外部联系人", 3: "内部群", 4: "内部联系人"}
              scene = scene_map.get(roomType, f"未知({roomType})")

              # 是否需要门控 (群聊 + 未@)
              need_gate = is_group and not at_me

              return {
                  "is_group": is_group,
                  "at_me": at_me,
                  "is_image": is_image,
                  "is_unsupported": is_unsupported,
                  "chat_id": chat_id,
                  "session_id": session_id,
                  "gate_msg": gate_msg,
                  "scene": scene,
                  "need_gate": need_gate,
                  "spoken": spoken,
                  "receivedName": receivedName,
                  "groupName": groupName,
                  "groupRemark": groupRemark,
                  "fileBase64": fileBase64,
                  "messageId": messageId,
                  "roomType": roomType,
                  "text_type": textType,
              }
        code_language: python3
        outputs:
          at_me:
