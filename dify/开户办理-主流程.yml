app:
  description: 开户办理主流程 — 独立的企业开户办理客服工作流。接收与「客服-主流程」一致的 WorkTool 回调参数，
    经门控与开户意图识别后，多轮收集企业开户必填信息（企业名称/统一社会信用代码/法定代表人/经办人电话/开户类型），
    信息齐全后通过 WorkTool API（type=218）发送开户材料文件，并回答开户流程/材料咨询；回复统一经 WorkTool 发送。
    适用于在群绑定表 group_bindings.workflow_app_id 中配置了本工作流的群（其余群仍走「客服-主流程」）。
  icon: 🏦
  icon_background: '#E7F3FF'
  icon_type: emoji
  mode: workflow
  name: 开户办理-主流程
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.20@850efe73fb62bbe7ab2229116086596596297a77174fb86f73e1363b99a24116
    version: null
kind: app
