    - data:
        context:
          enabled: false
          variable_selector: []
        memory: null
        model:
          completion_params: {}
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_config:
          jinja2_variables: []
        prompt_template:
        - id: prompt_gate_system
          role: system
          text: '你是群聊回复门控器。

            ## 任务

            结合对话历史，判断最后一条用户消息是否应由机器人回复，并还原用户的真实问题。

            ## 真实问题还原规则

            - 若最后一条消息含指代（如"那材料呢？"、"那需要什么？"），结合历史将指代替换为具体实体，输出完整提问。

            - 若本身已清晰，直接复制原消息。

            ## 回复判定规则

            - should_reply = true：企业开户办理（我要开户、办理开户、开户信息提供等）、开户流程/材料/费用咨询、以及其他开户相关话题。

            - should_reply = false：成员间闲聊、互相对话、与开户无关。

            ## 输出格式（严格 JSON）

            {"real_question": "完整问题", "should_reply": true/false, "reason": "判定理由"}

            ## 示例

            对话：用户:"开户需要准备什么？" 机器人:"需要营业执照、法人身份证等。" 用户:"那公章呢？"

            输出：{"real_question": "开户需要准备公章吗？", "should_reply": true, "reason": "开户材料咨询"}

            现在开始处理。'
        - id: prompt_gate_user
          role: user
          text: '群名：  {{#code_validate.groupName#}}

            {{#start.recentContext#}}

            发送者：{{#code_validate.receivedName#}}

            最后一条消息：{{#code_validate.gate_msg#}}'
        reasoning_format: tagged
        selected: false
        structured_output: null
        structured_output_switch_on: false
        title: AI 门控判断
        type: llm
        variables: []
        vision:
          enabled: false
      height: 88
      id: llm_gate
      position:
        x: 1408
        y: 399.9333333333333
      positionAbsolute:
        x: 1408
        y: 399.9333333333333
      selected: false
      type: custom
      width: 242
