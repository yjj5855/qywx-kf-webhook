    - data:
        code: "import json\nimport re\n\n\ndef main(text: str, current_stage: int) -> dict:\n    \"\"\"解析客服 Agent 输出：messages 列表（1~3 段）、send_file、stage；解析失败则整段当第一条。\"\"\"\n    try:\n        stage = int(current_stage)\n\
          \    except (TypeError, ValueError):\n        stage = 0\n    empty = {\"reply_text\": \"\", \"send_file\": False, \"stage\": stage,\n             \"msg1\": \"\", \"msg2\": \"\", \"msg3\": \"\"\
          ,\n             \"has1\": False, \"has2\": False, \"has3\": False}\n    if not text:\n        return empty\n\n    raw = re.sub(r\"<(?:think|thinking|reasoning)>.*?</(?:think|thinking|reasoning)>\"\
          , \"\", text, flags=re.S | re.I).strip()\n\n    data = None\n    try:\n        data = json.loads(raw)\n    except (json.JSONDecodeError, ValueError):\n        m = re.search(r\"\\{.*\\}\", raw,\
          \ re.S)\n        if m:\n            try:\n                data = json.loads(m.group(0))\n            except (json.JSONDecodeError, ValueError):\n                data = None\n\n    if not isinstance(data,\
          \ dict):\n        # 解析失败：整段当第一条\n        return {\"reply_text\": raw, \"send_file\": False, \"stage\": stage,\n                \"msg1\": raw, \"msg2\": \"\", \"msg3\": \"\",\n                \"\
          has1\": bool(raw.strip()), \"has2\": False, \"has3\": False}\n\n    send_file = bool(data.get(\"send_file\")) or False\n    try:\n        s = int(data.get(\"stage\", stage))\n    except (TypeError,\
          \ ValueError):\n        s = stage\n    if not (0 <= s <= 4):\n        s = stage\n\n    reply = str(data.get(\"reply_text\") or \"\").strip()\n    msgs = data.get(\"messages\")\n    parts = []\n\
          \    if isinstance(msgs, list):\n        parts = [str(m).strip() for m in msgs if isinstance(m, str) and m.strip()]\n    if not parts and reply:\n        parts = [reply]\n    if not parts:\n \
          \       return {**empty, \"send_file\": send_file, \"stage\": s}\n\n    m1 = parts[0] if len(parts) > 0 else \"\"\n    m2 = parts[1] if len(parts) > 1 else \"\"\n    m3 = parts[2] if len(parts)\
          \ > 2 else \"\"\n    return {\n        \"reply_text\": reply or m1,\n        \"send_file\": send_file,\n        \"stage\": s,\n        \"msg1\": m1, \"msg2\": m2, \"msg3\": m3,\n        \"has1\"\
          : bool(m1), \"has2\": bool(m2), \"has3\": bool(m3),\n    }\n"
        code_language: python3
