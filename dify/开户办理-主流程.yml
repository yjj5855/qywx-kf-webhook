    - data:
        code: "import json\nimport re\n\nMATERIAL_HINTS = (\"营业执照\", \"法人信息\", \"银行账户\")\n\n\ndef _is_material_collect(text: str) -> bool:\n    return sum(1 for k in MATERIAL_HINTS if k in text) >= 2\n\n\
          \ndef _clamp_stage(agent_stage, current_stage: int) -> int:\n    try:\n        s = int(agent_stage)\n    except (TypeError, ValueError):\n        s = current_stage\n    if not (0 <= s <= 4):\n\
          \        s = current_stage\n    if current_stage == 0:\n        return 0\n    return min(max(s, current_stage), current_stage + 1)\n\n\ndef main(text: str, current_stage: int) -> dict:\n    try:\n\
          \        stage = int(current_stage)\n    except (TypeError, ValueError):\n        stage = 0\n    if not (0 <= stage <= 4):\n        stage = 0\n\n    empty = {\"action\": \"\", \"reply_text\":\
          \ \"\", \"send_file\": False, \"stage\": stage,\n             \"msg1\": \"\", \"msg2\": \"\", \"msg3\": \"\",\n             \"has1\": False, \"has2\": False, \"has3\": False}\n    if not text:\n\
          \        return empty\n\n    raw = re.sub(r\"<(?:think|thinking|reasoning)>.*?</(?:think|thinking|reasoning)>\", \"\", text, flags=re.S | re.I).strip()\n    data = None\n    try:\n        data\
          \ = json.loads(raw)\n    except (json.JSONDecodeError, ValueError):\n        m = re.search(r\"\\{.*\\}\", raw, re.S)\n        if m:\n            try:\n                data = json.loads(m.group(0))\n\
          \            except (json.JSONDecodeError, ValueError):\n                data = None\n\n    if not isinstance(data, dict):\n        return {**empty, \"reply_text\": raw, \"msg1\": raw, \"has1\"\
          : bool(raw.strip())}\n\n    action = str(data.get(\"action\") or \"\").strip()\n    send_file = bool(data.get(\"send_file\")) or False\n    out_stage = _clamp_stage(data.get(\"stage\", stage),\
          \ stage)\n\n    reply = str(data.get(\"reply_text\") or \"\").strip()\n    msgs = data.get(\"messages\")\n    parts = []\n    if isinstance(msgs, list):\n        parts = [str(x).strip() for x\
          \ in msgs if isinstance(x, str) and x.strip()]\n    if not parts and reply:\n        parts = [reply]\n    if not parts:\n        return {**empty, \"action\": action, \"send_file\": send_file,\
          \ \"stage\": out_stage}\n\n    if out_stage < 3 and any(_is_material_collect(p) for p in parts):\n        parts = [\"好的，您先了解，有任何问题随时问我；确定办理的话说一声，我马上安排签约。\"]\n\n    m1 = parts[0] if len(parts)\
          \ > 0 else \"\"\n    m2 = parts[1] if len(parts) > 1 else \"\"\n    m3 = parts[2] if len(parts) > 2 else \"\"\n    return {\"action\": action, \"reply_text\": reply or m1, \"send_file\": send_file,\
          \ \"stage\": out_stage,\n            \"msg1\": m1, \"msg2\": m2, \"msg3\": m3,\n            \"has1\": bool(m1), \"has2\": bool(m2), \"has3\": bool(m3)}\n"
