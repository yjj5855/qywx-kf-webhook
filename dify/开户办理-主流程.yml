app:
  description: 开户办理主流程 — 独立的企业开户办理客服工作流。接收与「客服-主流程」一致的 WorkTool 回调参数， 经门控与开户意图识别后，多轮收集企业开户必填信息（企业名称/统一社会信用代码/法定代表人/经办人电话/开户类型）， 信息齐全后通过 WorkTool API（type=218）发送开户材料文件，并回答开户流程/材料咨询；回复统一经 WorkTool 发送。 适用于在群绑定表
    group_bindings.workflow_app_id 中配置了本工作流的群（其余群仍走「客服-主流程」）。
  icon: 🏦
  icon_background: '#E7F3FF'
  icon_type: emoji
  mode: workflow
  name: 开户办理-主流程
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.20@850efe73fb62bbe7ab2229116086596596297a77174fb86f73e1363b99a24116
    version: null
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables:
  - value_type: string
    id: env_api_base_url
    name: WT_API_BASE_URL
    value: https://api.worktool.ymdyes.cn
    description: WorkTool API 基础地址
    selector:
    - - env
      - WT_API_BASE_URL
  - value_type: string
    id: env_robot_id
    name: WT_ROBOT_ID
    value: wtgxpt9udc4pb4hgj0rnn139gfwcc6ls
    description: 机器人 ID
    selector:
    - - env
      - WT_ROBOT_ID
  - value_type: string
    id: env_open_account_file_url
    name: WT_OPEN_ACCOUNT_FILE_URL
    value: ''
    description: 开户材料文件的网络地址（type=218 推送任意图片/音视频/文件 使用；留空则只回复文字不发文件）
    selector:
    - - env
      - WT_OPEN_ACCOUNT_FILE_URL
  - value_type: string
    id: env_open_account_file_name
    name: WT_OPEN_ACCOUNT_FILE_NAME
    value: 开户申请材料.zip
    description: 开户材料文件名（含后缀，如 开户申请材料.zip）
    selector:
    - - env
      - WT_OPEN_ACCOUNT_FILE_NAME
  - value_type: number
    id: env_confidence_threshold
    name: CONFIDENCE_THRESHOLD
    value: 0.7
    description: 意图识别置信度阈值
    selector:
    - - env
      - CONFIDENCE_THRESHOLD
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 开户办理主流程已就绪。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - data:
        selected: false
        title: Webhook 回调入口
        type: start
        variables:
        - label: spoken
          max_length: 256
          required: true
          type: text-input
          variable: spoken
        - label: rawSpoken
          max_length: 256
          required: false
          type: text-input
          variable: rawSpoken
        - hide: false
          label: receivedName
          max_length: 256
          required: false
          type: text-input
          variable: receivedName
        - label: groupName
          max_length: 256
          required: false
          type: text-input
          variable: groupName
        - label: groupRemark
          max_length: 256
          required: false
          type: text-input
          variable: groupRemark
        - label: roomType
          max_length: 10
          required: false
          type: number
          variable: roomType
        - label: atMe
          max_length: 20
          required: false
          type: checkbox
          variable: atMe
        - label: textType
          max_length: 10
          required: false
          type: number
          variable: textType
        - label: fileBase64
          max_length: 256
          required: false
          type: text-input
          variable: fileBase64
        - label: messageId
          max_length: 128
          required: false
          type: text-input
          variable: messageId
        - label: 历史对话
          max_length: 25600
          required: false
          type: paragraph
          variable: recentContext
        - default: ''
          hint: ''
          label: 公司 id (多家公司以、或;分割)
          max_length: 256
          options: []
          placeholder: ''
          required: false
          type: text-input
          variable: companyIds
        - default: ''
          hint: ''
          label: 群知识库id
          max_length: 256
          options: []
          placeholder: ''
          required: false
          type: text-input
          variable: datasetId
        - default: 0
          hint: 0=未开始 1=初次触达 2=转化签约 3=签约后交付 4=长期服务（由工作流回写，勿手动改）
          label: 当前服务阶段
          max_length: 10
          options: []
          placeholder: ''
          required: false
          type: number
          variable: currentStage
      height: 447
      id: start
      position:
        x: 0
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      selected: false
      type: custom
      width: 242
      zIndex: 0
    - data:
        code: "def main(\n    spoken: str,\n    rawSpoken: str,\n    receivedName: str,\n    groupName: str,\n    groupRemark: str,\n    roomType: int,\n    atMe,\n    textType: int,\n    fileBase64: str,\n\
          \    messageId: str,\n):\n    # 是否群聊 (roomType 1=外部群 3=内部群)\n    is_group = roomType in (1, 3)\n\n    # 是否被 @\n    at_me = str(atMe).lower() in (\"true\", \"1\", \"yes\")\n\n    # 是否是图片消息\n  \
          \  is_image = textType == 2\n\n    # 不支持的媒体类型：0=未知 3=语音 5=视频 7=小程序 8=链接 9=文件\n    # （1=文本 2=图片 13=合并记录 15=带回复文本 视为可处理）\n    is_unsupported = textType not in (1, 2, 13, 15)\n\n    # 会话标识：群聊用群备注/群名，单聊用联系人名称\n\
          \    chat_id = (groupRemark or groupName) if is_group else receivedName\n    session_id = f\"{roomType}:{chat_id}\"\n\n    # 门控消息文本：图片时用占位\n    gate_msg = spoken or (\"[图片]\" if is_image else\
          \ \"\")\n\n    # 场景描述\n    scene_map = {1: \"外部群\", 2: \"外部联系人\", 3: \"内部群\", 4: \"内部联系人\"}\n    scene = scene_map.get(roomType, f\"未知({roomType})\")\n\n    # 是否需要门控 (群聊 + 未@)\n    need_gate =\
          \ is_group and not at_me\n\n    return {\n        \"is_group\": is_group,\n        \"at_me\": at_me,\n        \"is_image\": is_image,\n        \"is_unsupported\": is_unsupported,\n        \"chat_id\"\
          : chat_id,\n        \"session_id\": session_id,\n        \"gate_msg\": gate_msg,\n        \"scene\": scene,\n        \"need_gate\": need_gate,\n        \"spoken\": spoken,\n        \"receivedName\"\
          : receivedName,\n        \"groupName\": groupName,\n        \"groupRemark\": groupRemark,\n        \"fileBase64\": fileBase64,\n        \"messageId\": messageId,\n        \"roomType\": roomType,\n\
          \        \"text_type\": textType,\n    }"
        code_language: python3
        outputs:
          at_me:
            children: null
            type: boolean
          chat_id:
            children: null
            type: string
          fileBase64:
            children: null
            type: string
          gate_msg:
            children: null
            type: string
          groupName:
            children: null
            type: string
          groupRemark:
            children: null
            type: string
          is_group:
            children: null
            type: boolean
          is_image:
            children: null
            type: boolean
          is_unsupported:
            children: null
            type: boolean
          messageId:
            children: null
            type: string
          need_gate:
            children: null
            type: boolean
          receivedName:
            children: null
            type: string
          roomType:
            children: null
            type: number
          scene:
            children: null
            type: string
          session_id:
            children: null
            type: string
          spoken:
            children: null
            type: string
          text_type:
            children: null
            type: number
        selected: false
        title: 校验 & 预处理
        type: code
        variables:
        - value_selector:
          - start
          - spoken
          variable: spoken
        - value_selector:
          - start
          - rawSpoken
          variable: rawSpoken
        - value_selector:
          - start
          - receivedName
          variable: receivedName
        - value_selector:
          - start
          - groupName
          variable: groupName
        - value_selector:
          - start
          - groupRemark
          variable: groupRemark
        - value_selector:
          - start
          - roomType
          variable: roomType
        - value_selector:
          - start
          - atMe
          variable: atMe
        - value_selector:
          - start
          - textType
          variable: textType
        - value_selector:
          - start
          - fileBase64
          variable: fileBase64
        - value_selector:
          - start
          - messageId
          variable: messageId
      height: 52
      id: code_validate
      position:
        x: 342
        y: 272
      positionAbsolute:
        x: 342
        y: 272
      selected: false
      type: custom
      width: 242
      zIndex: 0
    - data:
        agent_parameters:
          instruction:
            type: constant
            value: "# 角色定义\n\n你是班步一企通的企业创业管家智能客服（企业服务服务商），负责初创企业的一站式财税、人事托管服务。\n你可以调用「提交工单」「查询开户进度」工具；回复文本由工作流统一发送，你只需输出 JSON。\n\n# 是否需要回复（群聊门控）\n\n- 被 @（atMe=true）：必须回复。若处于 stage=0（未开始）→ 主动发起第一阶段介绍（见「第一阶段」触发条件）；其他阶段按当前阶段正常应答。\n\
              - 未被 @ 的群聊：仅回复与公司服务、签约办理、业务咨询、工单处理相关的内容；成员间闲聊、互相对话、与业务无关 → reply_text 输出空字符串（不回复）。\n- 私聊默认回复。\n\n# 消息类型\n\n若消息类型 textType 不在 1文本/2图片/13合并记录/15带回复文本（如语音3/视频5/文件9等），\n回复：\"抱歉，暂不支持处理该类消息，请用文字描述您的需求。\"\
              \n\n# 服务阶段状态（重要）\n\n你当前处于的服务阶段：{{#start.currentStage#}}（0=未开始/未知 1=初次触达 2=转化签约 3=签约后交付 4=长期服务）。\n\n阶段推进规则（只前进不倒退，无推进时输出当前值）：\n- 0 未开始：首次接触/客户刚注册 → 按第一阶段发送介绍 → 置 stage=1\n- 1 初次触达：客户提问/次日回访\
              \ → 按第二阶段答疑转化 → 置 stage=2（若仍在介绍咨询，保持 1）\n- 2 转化签约：客户确认签约/同意办理 → 按第三阶段交付 → 置 stage=3\n- 3 签约后交付：资料收齐、后台开通、顾问对接完成 → 置 stage=4\n- 4 长期服务：保持 4\n\n判断依据优先用上面的阶段号，其次参考【历史对话】；不要重复发送已发过的介绍话术。\n\n#\
              \ 服务全流程（四阶段，按客户所处阶段响应）\n\n## 第一阶段：微信初次触达（客户刚完成公司注册）\n\n触发条件：群内企业员工 @ 你（atMe=true）且处于 stage=0（未开始/未知），或客户首次咨询公司服务。\n满足即主动发起（不需要客户继续追问），依次执行三步；执行完毕置 stage=1。\n\n当客户是刚注册完成的新公司、新联系人，或首次咨询公司服务时，依次执行三步：\n\
              \n动作1 发送三大核心托管服务介绍，原文话术：\n\"（群聊场景把\"X总您好\"改为被@员工的称呼，如\"X总您好\"；未知名用\"各位好\"）X总您好，从园区那边了解贵司注册流程已全部办结，您可以了解一下班步一企通， 财税代理服务，人事外包服务 这些我们都能帮您一站式解决，属于专为初创企业设置的创业管家，现在凡入驻田野聚落的企业，可享受9个月免费托管试用期，试用期内全套财税、人事服务全部免费使用；9个月试用期满后，如果使用满意可以继续使用，不满意可随时停用不收任何费用。\"\
              \n\n动作2 推送产品素材与平台演示链接：\n\"这是我们产品的服务平台您可以看一下\nhttps://www.ibanbu.com/OneBiz/presales.html\"\n\n动作3 线上收尾，预留沟通窗口，原文话术：\n\"您可以先了解一下，如果有不清楚的地方可以随时与我沟通。\"\n\n【阶段备注】留意客户阅读反馈与提出的疑问点，次日统一电话回访解答；需要人工电话回访时调用「提交工单」工具（issue_type=电话回访）。\n\
              \n## 第二阶段：次日电话转化签约（核心成交环节）\n\n客户就服务提问、犹豫或回访沟通时，按以下话术应对：\n\n步骤1 电话开场破冰（客户为次日回访/再次沟通场景）：\n\"X总您好，我是班步一企通的对接专员，昨天微信给您发了咱们企业托管服务的内容和平台演示链接，请问您抽空看过了吗？有没有哪里看不懂、想详细了解的？\"\n\n步骤2 针对性答疑解惑（对应客户疑问分类）：\n\
              - 服务细节疑问，话术：\"财税这边我们全程负责记账报税，小程序随时能看收支；人事从签合同、发工资到社保增减员全包；补贴会主动匹配您公司能申报的政策，材料我们整理。\"\n- 9个月免费福利疑问，话术：\"只要是田野聚落入驻企业，9个月内财税服务，人事代理全部免费，没有隐形消费；9个月到期后您觉得好用，再交2500-3000元/年服务费，中途不想用随时可以停，没有捆绑，政策补贴部分，在申请完毕您拿到手之后，收取最高不超过百分之十五的服务费。\"\
              \n- 专业度&风险顾虑，话术：\"我们有20年企业服务经验，财税、人事都是专职顾问一对一跟进，系统还会自动预警发票、用工风险，规避经营踩坑。\"\n\n步骤3 强化服务核心价值，刺激签约，话术：\n\"您刚注册完公司，后续做账、发员工工资、申报补贴琐事特别多，交给我们托管您不用多头找代办，9个月免费试用刚好帮您度过初创最难的阶段，节省人力和资金成本。\"\n\n步骤4 引导签约，确认办理手续，话术：\n\
              \"如果您这边认可这套服务，现在就可以走托管签约流程，今天开通权限，我们马上安排顾问对接您公司后续财税人事工作。\"\n\n## 第三阶段：签约后落地交付服务\n\n客户确认签约/同意办理后，依次执行：\n\n动作1 收集企业基础资料（多轮收集，一次追问一项，结合【历史对话】保留已收集项）：\n\"X总，麻烦您提供一下公司营业执照、法人信息、银行账户相关资料，我们录入系统开通平台权限。\"\
              \n资料齐全后 → 回复确认摘要，并按【开户材料文件地址】决定 send_file；客户不办了 → 回复取消确认。\n\n动作2 开通客户小程序后台：\n\"已经为您开通企业管理后台，就是昨天发您的demo平台，您随时查看报税、发薪进度。\"\n\n动作3 分配专属财税、人事顾问：\n\"后续会有专属顾问添加您微信，月度同步账务、人事台账，有任何经营问题直接对接顾问即可。\"\
              \n\n动作4 建立长期常态化跟进机制：\n\"每月固定同步：企业收支报表、税务申报完成提醒、新增可申报补贴政策通知。\"\n\n## 第四阶段：全程底层配套保障（沟通时可随时补充）\n\n1. 产品支撑：自研可视化小程序，业务办理进度实时可查，全流程留痕；\n2. 团队支撑：20年企业服务行业积淀，财税、人事专项顾问一对一跟进；\n3. 政策支撑：持续梳理区域创业扶持政策，主动协助企业申报补贴，做到政策红利应享尽享。\n\
              \n# 工具使用\n\n1. 提交工单：客户事项需要人工/线下处理（人工审核、线下办理、预约、投诉、纠纷、紧急情况、安排电话回访等）→\n   调用「提交工单」工具，收集 company_id（群绑定的公司ID，没有则填企业名称）、issue_type、description、\n   contact_name（默认发送者）、contact_phone（用户提供过才填）→\
              \ 把工单结果整理进 reply_text；\n   工具不可用或调用失败 → \"已为您登记，客服会尽快与您联系处理。\"\n\n2. 查询开户进度：客户问\"服务开通进度/开通到哪一步/开户进度/开户信息\" → 调用「查询开户进度」工具\n   （此时企业可能尚未开通、没有公司ID：用企业名称或经办人手机号查询，从对话中提取，缺失则追问）\n   → 根据工具返回的开户流程状态，回复\"\
              您公司的开户已进行到 XX 环节\"（按返回内容组织，不编造）。\n   工具不可用或调用失败 → \"正在为您核实开户进度，稍后反馈给您。\"\n\n# 开户材料文件地址\n\n【开户材料文件地址】{{#env.WT_OPEN_ACCOUNT_FILE_URL#}}（空=未配置）\n- 非空且第三阶段资料收集齐全 → send_file=true，回复\"已为您发送签约/开通材料，请注意查收。\"\
              \n- 为空 → send_file 恒为 false，不回复发文件相关的话术。\n\n# 输出格式（严格 JSON，只输出一个 JSON 对象，不要输出任何其他文字）\n\n{\"reply_text\": \"第一条文本（用于记录，与 messages[0] 一致）\", \"messages\": [\"第一条文本\", \"第二条文本\", \"第三条文本\"],\
              \ \"send_file\": true/false, \"stage\": 当前或推进后的阶段号(0-4)}\n- messages 为本次要发送的文本列表（1~3 条），工作流会按顺序逐条发送；第一阶段三步话术 → 3 条，一般回复 → 1 条；\n- 需要发多条时不要合并成一条，逐条列出；无需回复时 messages 为空数组且 reply_text 为空字符串。\n\
              \n# 注意事项\n\n- 话术中的\"X总\"按客户实际称呼替换：有姓用\"X总/先生/女士\"，未知则用\"您好\"。\n- 不编造工单号、不编造进度数据。\n- 回答极简，纯文本，不使用 Markdown。\n- 每次回复后不追问\"还有其他问题吗\"。\n"
          model:
            type: constant
            value:
              completion_params: {}
              mode: chat
              model: deepseek-v4-flash
              model_type: llm
              provider: langgenius/deepseek/deepseek
              type: model-selector
          query:
            type: constant
            value: '【历史对话】

