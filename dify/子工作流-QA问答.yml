    - data:
        code: "import json\n\ndef main(static_body_http: str = \"\", static_body_empty: str = \"\", dyn_body_http: str = \"\", dyn_body_empty: str = \"\", top_k: int = 4, max_chars: int = 300):\n    \"\"\"合并静态制度库与动态群聊库的检索片段，格式化为参考资料文本。\n    未配置/未命中的分支由守卫节点输出空 body，这里用 or 兜底取非空侧。\"\"\"\n    def extract(body):\n        if not body:\n            return []\n        try:\n            data = json.loads(body)\n        except Exception:\n            return []\n        out = []\n        for rec in (data.get(\"records\") or []):\n            seg = (rec or {}).get(\"segment\") or {}\n            content = (seg.get(\"content\") or \"\").strip()\n            if content:\n                out.append(content[:max_chars])\n        return out\n\n    static = extract(static_body_http or static_body_empty)[:top_k]\n    dynamic = extract(dyn_body_http or dyn_body_empty)[:top_k]\n    lines = []\n    if static:\n        lines.append(\"【制度资料】\")\n        lines.extend(f\"- {c}\" for c in static)\n    if dynamic:\n        lines.append(\"【群聊记录】\")\n        lines.extend(f\"- {c}\" for c in dynamic)\n    return {\"context\": \"\\n\".join(lines)}\n"
        code_language: python3
        outputs:
          context:
            children: null
            type: string
        selected: false
