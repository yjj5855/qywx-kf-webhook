    - data:
        code: "def main(\n    spoken: str,\n    rawSpoken: str,\n    receivedName:\
          \ str,\n    groupName: str,\n    groupRemark: str,\n    roomType: int,\n\
          \    atMe,\n    textType: int,\n    fileBase64: str,\n    messageId: str,\n\
          ):\n    # 是否群聊 (roomType 1=外部群 3=内部群)\n    is_group = roomType in (1, 3)\n\
          \n    # 是否被 @\n    at_me = str(atMe).lower() in (\"true\", \"1\", \"yes\"\
          )\n\n    # 是否是图片消息\n    is_image = textType == 2\n\n    # 不支持的媒体类型：0=未知\
          \ 3=语音 5=视频 7=小程序 8=链接 9=文件\n    # （1=文本 2=图片 13=合并记录 15=带回复文本 视为可处理）\n\
          \    is_unsupported = textType not in (1, 2, 13, 15)\n\n    # 会话标识：群聊用群备注/群名，单聊用联系人名称\n\
          \    chat_id = (groupRemark or groupName) if is_group else receivedName\n\
          \    session_id = f\"{roomType}:{chat_id}\"\n\n    # 门控消息文本：图片时用占位\n   \
          \ gate_msg = spoken or (\"[图片]\" if is_image else \"\")\n\n    # 场景描述\n\
          \    scene_map = {1: \"外部群\", 2: \"外部联系人\", 3: \"内部群\", 4: \"内部联系人\"}\n\
          \    scene = scene_map.get(roomType, f\"未知({roomType})\")\n\n    # 是否需要门控\
          \ (群聊 + 未@)\n    need_gate = is_group and not at_me\n\n    return {\n  \
          \      \"is_group\": is_group,\n        \"at_me\": at_me,\n        \"is_image\"\
          : is_image,\n        \"is_unsupported\": is_unsupported,\n        \"chat_id\"\
          : chat_id,\n        \"session_id\": session_id,\n        \"gate_msg\": gate_msg,\n\
          \        \"scene\": scene,\n        \"need_gate\": need_gate,\n        \"\
          spoken\": spoken,\n        \"receivedName\": receivedName,\n        \"groupName\"\
          : groupName,\n        \"groupRemark\": groupRemark,\n        \"fileBase64\"\
          : fileBase64,\n        \"messageId\": messageId,\n        \"roomType\":\
          \ roomType,\n        \"text_type\": textType,\n    }\n"
