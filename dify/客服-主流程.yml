    - data:
        code: "import json\nimport re\n\ndef main(text: str) -> dict:\n    # 方法1：先提取\
          \ </think> 之后的内容\n    match = re.search(r'</think>\\s*(\\{.*\\})', text,\
          \ re.DOTALL)\n    if match:\n        try:\n            return json.loads(match.group(1))\n\
          \        except:\n            return {\"real_question\": \"\", \"should_reply\"\
          : False, \"reason\": \"解析失败\"}\n    \n    # 方法2：直接找最外层的 JSON（非贪婪匹配，但要注意嵌套）\n\
          \    match = re.search(r'\\{[^{}]*\\}', text)\n    if match:\n        try:\n\
          \            return json.loads(match.group())\n        except:\n       \
          \     return {\"real_question\": \"\", \"should_reply\": False, \"reason\"\
          : \"解析失败\"}\n    \n    return {\"real_question\": \"\", \"should_reply\"\
          : False, \"reason\": \"未找到JSON\"}"
