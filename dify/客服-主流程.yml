    - data:
        code: "import json\n\n# 意图 → 大类映射（模型未输出 category 时兜底推导）\nCATEGORY_MAP = {\n\
          \    \"ADD_FRIEND\": \"WORKTOOL_OP\",\n    \"ADD_MEMBER\": \"WORKTOOL_OP\"\
          ,\n    \"CREATE_GROUP\": \"WORKTOOL_OP\",\n    \"CUSTOMER_SERVICE_QA\":\
          \ \"QA\",\n    \"COMPANY_INFO_QUERY\": \"COMPANY_QUERY\",\n}\n\ndef main(llm_output,\
          \ confidence_threshold: float):\n    \"\"\"\n    解析意图 LLM 返回的 JSON，校验置信度阈值并推导大类。\n\
          \    llm_output 可能是 JSON 字符串（可能带思考标签），也可能是已解析的 dict。\n    \"\"\"\n    default\
          \ = {\n        \"intent\": \"UNKNOWN\",\n        \"confidence\": 0.0,\n\
          \        \"target_person\": \"\",\n        \"target_group\": \"\",\n   \
          \     \"target_phone\": \"\",\n        \"query_type\": \"\",\n        \"\
          keyword\": \"\",\n        \"period\": \"\",\n        \"category\": \"UNKNOWN\"\
          ,\n    }\n\n    if not llm_output:\n        return default\n\n    try:\n\
          \        if isinstance(llm_output, dict):\n            data = llm_output\n\
          \        else:\n            import re\n\n            raw = str(llm_output)\n\
          \            raw = re.sub(r\"<thinking>.*?</thinking>\", \"\", raw, flags=re.S)\n\
          \            raw = re.sub(r\"<think>.*?</think>\", \"\", raw, flags=re.S)\n\
          \            data = json.loads(raw.strip())\n        if not isinstance(data,\
          \ dict):\n            data = default\n\n        intent_str = str(data.get(\"\
          intent\", \"UNKNOWN\")).upper().strip()\n        try:\n            confidence\
          \ = float(data.get(\"confidence\", 0.0) or 0.0)\n        except (TypeError,\
          \ ValueError):\n            confidence = 0.0\n        target_person = str(data.get(\"\
          target_person\", \"\"))\n        target_group = str(data.get(\"target_group\"\
          , \"\"))\n        target_phone = str(data.get(\"target_phone\", \"\"))\n\
          \        query_type = str(data.get(\"query_type\", \"\")).strip().lower()\n\
          \        keyword = str(data.get(\"keyword\", \"\"))\n        period = str(data.get(\"\
          period\", \"\"))\n\n        # 置信度低于阈值 → UNKNOWN\n        if confidence <\
          \ confidence_threshold:\n            intent_str = \"UNKNOWN\"\n        \
          \    confidence = 0.0\n\n        # 兼容别名，统一意图名\n        if intent_str in\
          \ (\"QA\", \"CUSTOMER_QA\", \"CUSTOMER_SERVICE\", \"QA_QUESTION\"):\n  \
          \          intent_str = \"CUSTOMER_SERVICE_QA\"\n        if intent_str in\
          \ (\"COMPANY_QUERY\", \"COMPANY_INFO\", \"QUERY_COMPANY\"):\n          \
          \  intent_str = \"COMPANY_INFO_QUERY\"\n\n        # 大类：优先取模型输出，非法值则按意图推导\n\
          \        category = str(data.get(\"category\", \"\")).strip().upper()\n\
          \        if category not in CATEGORY_MAP.values():\n            category\
          \ = CATEGORY_MAP.get(intent_str, \"UNKNOWN\")\n\n        return {\n    \
          \        \"intent\": intent_str,\n            \"confidence\": min(max(confidence,\
          \ 0.0), 1.0),\n            \"target_person\": target_person,\n         \
          \   \"target_group\": target_group,\n            \"target_phone\": target_phone,\n\
          \            \"query_type\": query_type,\n            \"keyword\": keyword,\n\
          \            \"period\": period,\n            \"category\": category,\n\
          \        }\n    except (json.JSONDecodeError, ValueError, TypeError):\n\
          \        # 降级：纯文本匹配\n        text_upper = str(llm_output).strip().upper()\n\
          \        if \"CREATE_GROUP\" in text_upper:\n            return {**default,\
          \ \"intent\": \"CREATE_GROUP\", \"confidence\": 0.9, \"category\": \"WORKTOOL_OP\"\
          }\n        if \"ADD_MEMBER\" in text_upper:\n            return {**default,\
          \ \"intent\": \"ADD_MEMBER\", \"confidence\": 0.9, \"category\": \"WORKTOOL_OP\"\
          }\n        if \"ADD_FRIEND\" in text_upper:\n            return {**default,\
          \ \"intent\": \"ADD_FRIEND\", \"confidence\": 0.9, \"category\": \"WORKTOOL_OP\"\
          }\n        return default\n"
