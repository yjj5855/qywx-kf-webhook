    - data:
        code: "import json\nimport re\n\n\ndef main(text: str) -> dict:\n    \"\"\"\
          \n    解析 Dify LLM 节点返回，提取纯净极简回答。\n    \"\"\"\n    if not text:\n       \
          \ return {\"answer\": \"\"}\n    \n    raw_content = text\n    \n    # 解析\
          \ JSON 提取 text 字段\n    try:\n        data = json.loads(text)\n        raw_content\
          \ = data.get(\"text\") or data.get(\"answer\") or \"\"\n    except json.JSONDecodeError:\n\
          \        raw_content = text\n    \n    if not raw_content:\n        return\
          \ {\"answer\": \"\"}\n    \n    # 移除思考标签\n    clean_answer = remove_think_tag(raw_content)\n\
          \    clean_answer = clean_whitespace(clean_answer)\n    \n    return {\"\
          answer\": clean_answer}\n\n\ndef remove_think_tag(content: str) -> str:\n\
          \    \"\"\"移除思考标签\"\"\"\n    patterns = [\n        r\"<think>.*?</think>\"\
          ,\n        r\"<thinking>.*?</thinking>\",\n        r\"<thought>.*?</thought>\"\
          ,\n        r\"<reasoning>.*?</reasoning>\",\n        r\"<!--dify-deepseek-reasoning-->.*?</think>\"\
          ,\n    ]\n    for pattern in patterns:\n        content = re.sub(pattern,\
          \ \"\", content, flags=re.DOTALL | re.IGNORECASE)\n    content = re.sub(r\"\
          <think>.*?(?=<think>|$)\", \"\", content, flags=re.DOTALL | re.IGNORECASE)\n\
          \    content = re.sub(r\"<!--dify-deepseek-reasoning-->\", \"\", content,\
          \ flags=re.DOTALL | re.IGNORECASE)\n    return content.strip()\n\n\ndef\
          \ clean_whitespace(content: str) -> str:\n    \"\"\"清洗多余空白\"\"\"\n    content\
          \ = re.sub(r\"\\n{3,}\", \"\\n\\n\", content)\n    content = re.sub(r\"\
          [ \\t]+\", \" \", content)\n    lines = [line.strip() for line in content.split(\"\
          \\n\")]\n    content = \"\\n\".join(lines)\n    return content.strip()\n\
          \n\ndef main(text: str) -> dict:\n    if not text:\n        return {\"answer\"\
          : \"\"}\n    try:\n        data = json.loads(text)\n        raw = data.get(\"\
          text\") or data.get(\"answer\") or \"\"\n        if raw and raw.strip().startswith((\"\
          {\", \"[\")):\n            try:\n                nested = json.loads(raw)\n\
          \                raw = nested.get(\"text\") or nested.get(\"answer\") or\
          \ raw\n            except json.JSONDecodeError:\n                pass\n\
          \        clean = remove_think_tag(raw)\n        clean = clean_whitespace(clean)\n\
          \        return {\"answer\": clean}\n    except json.JSONDecodeError:\n\
          \        clean = remove_think_tag(text)\n        clean = clean_whitespace(clean)\n\
          \        return {\"answer\": clean}"
