    - data:
        code: |
          import json
          import re

          def main(
              target_phone: str,
              target_person: str,
              spoken: str,
              robotId: str,
              apiBaseUrl: str,
          ):
              """
              构建加好友的 API 请求参数（type=213）。
              手机号优先取实体，其次从 spoken 中正则提取。
              """
              phone_re = re.compile(r"1[3-9]\d{9}")

              if not target_phone:
                  m = phone_re.search(spoken or "")
                  if m:
                      target_phone = m.group(0)

              if not target_phone:
                  return {
                      "api_body": "",
                      "api_url": "",
                      "reply_text": "请问要添加的好友手机号是多少？",
                      "need_api_call": False,
                  }

              mark_name = target_person or target_phone
              return {
                  "reply_text": f"已提交加好友申请（{mark_name}，{target_phone}），请等待对方通过。",
                  "need_api_call": True,
                  "api_url": f"{apiBaseUrl.rstrip('/')}/wework/sendRawMessage?robotId={robotId}",
                  "api_body": json.dumps({
                      "socketType": 2,
                      "list": [
                          {
                              "type": 213,
                              "friend": {
                                  "phone": target_phone,
                                  "markName": mark_name,
                                  "leavingMsg": "你好，我是机器人助理~",
                              },
                          }
                      ],
                  }, ensure_ascii=False),
              }
        code_language: python3
        outputs:
          api_body:
            children: null
            type: string
          api_url:
            children: null
            type: string
          need_api_call:
            children: null
            type: boolean
          reply_text:
            children: null
            type: string
        selected: false
        title: 构建加好友请求
