    - data:
        code: |
          def main(
              reply_text_add_friend, need_api_add_friend, api_url_add_friend, api_body_add_friend,
              reply_text_add_member, need_api_add_member, api_url_add_member, api_body_add_member,
              reply_text_create_group, need_api_create_group, api_url_create_group, api_body_create_group,
              reply_text_fallback, intent: str,
          ):
              """
              根据子意图路由结果聚合最终的回复文本和 API 调用参数。
              只有实际执行的分支会有值，其余分支为空字符串，不会影响结果。
              """
              mapping = {
                  "ADD_FRIEND": {
                      "reply_text": reply_text_add_friend,
                      "need_api_call": need_api_add_friend,
                      "api_url": api_url_add_friend,
                      "api_body": api_body_add_friend,
                  },
                  "ADD_MEMBER": {
                      "reply_text": reply_text_add_member,
                      "need_api_call": need_api_add_member,
                      "api_url": api_url_add_member,
                      "api_body": api_body_add_member,
                  },
                  "CREATE_GROUP": {
                      "reply_text": reply_text_create_group,
                      "need_api_call": need_api_create_group,
                      "api_url": api_url_create_group,
                      "api_body": api_body_create_group,
                  },
              }

              selected = mapping.get(intent, {
                  "reply_text": reply_text_fallback,
                  "need_api_call": False,
                  "api_url": "",
                  "api_body": "",
              })

              return {
                  "reply_text": selected.get("reply_text", ""),
                  "need_api_call": selected.get("need_api_call", False),
                  "api_url": selected.get("api_url", ""),
                  "api_body": selected.get("api_body", ""),
              }
