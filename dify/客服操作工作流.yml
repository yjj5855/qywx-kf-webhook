    - data:
        code: |
          import json

          def main(
              target_person: str = "",
              target_group: str = "",
              spoken: str = "",
              receivedName: str = "",
              is_group: bool = False,
              robotId: str = "",
              apiBaseUrl: str = "",
          ):
              """
              构建拉人进已有群的 API 请求参数（type=207）。
              """
              # 私聊中"拉我"→ 用户自己想进群
              if not is_group and target_person in ("", "我"):
                  target_person = receivedName or "您"

              # 群聊中没指定人 → 追问
              if is_group and not target_person:
                  return {
                      "reply_text": "请问需要邀请谁加入群呢？请提供姓名、手机号或微信号。",
                      "need_api_call": False,
                      "api_body": "",
                      "api_url": "",
                  }

              # 没指定目标群 → 追问
              if not target_group:
                  members_str = f"（成员：{target_person}）" if target_person else ""
                  return {
                      "reply_text": f"收到，请问要拉到哪个群呢？{members_str}",
                      "need_api_call": False,
                      "api_body": "",
                      "api_url": "",
                  }

              # 解析成员列表
              members = [m.strip() for m in target_person.replace("、", ",").split(",") if m.strip()]
              if receivedName and receivedName not in members and not is_group:
                  members.insert(0, receivedName)

              return {
                  "reply_text": f"已将 {', '.join(members)} 拉入群「{target_group}」，指令已下发。",
                  "need_api_call": True,
                  "api_url": f"{apiBaseUrl.rstrip('/')}/wework/sendRawMessage?robotId={robotId}",
                  "api_body": json.dumps({
                      "socketType": 2,
                      "list": [
                          {
                              "type": 207,
                              "groupName": target_group,
                              "selectList": members,
                          }
                      ],
                  }, ensure_ascii=False),
              }
        code_language: python3
        outputs:
          api_body:
            children: null
            type: string
          api_url:
            children: null
            type: string
          need_api_call:
            children: null
            type: boolean
          reply_text:
            children: null
            type: string
