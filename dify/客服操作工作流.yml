    - data:
        code: |
          import json

          def main(reply_text: str, api_body_raw: str = ""):
              """
              根据 WorkTool 指令响应决定最终回复文本。
              WorkTool 指令接口为异步下发：code==0 表示指令已进入执行队列。
              """
              final = reply_text or ""
              if api_body_raw:
                  try:
                      data = json.loads(api_body_raw)
                      code = data.get("code")
                      if code is not None and str(code) != "0":
                          msg = data.get("message") or data.get("msg") or "未知错误"
                          final = f"指令执行失败：{msg}"
                  except Exception:
                      final = "指令已提交，但无法确认执行结果，请留意后续消息。"
              return {"final_text": final}
        code_language: python3
        outputs:
          final_text:
            children: null
            type: string
        selected: false
        title: 确认指令结果并生成最终回复
        type: code
        variables:
        - value_selector:
          - code_aggregate
          - reply_text
          variable: reply_text
        - value_selector:
          - http_worktool
          - body
          value_type: string
          variable: api_body_raw
