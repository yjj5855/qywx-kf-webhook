          import json

          def main(
              target_person: str,
              target_group: str,
              receivedName: str,
              is_group: bool,
              robotId: str,
              apiBaseUrl: str,
          ):
              """
              构建创建新群的 API 请求参数（type=206）。
              """
              # 私聊中"建群"→ 用户自己也要在群里
              if not is_group and target_person in ("", "我"):
                  target_person = receivedName or "您"

              # 没指定群名 → 追问
              if not target_group:
                  members_str = f"（成员：{target_person}）" if target_person else ""
                  return {
                      "api_body": "",
                      "api_url": "",
                      "reply_text": f"收到，请问新群叫什么名字呢？{members_str}",
                      "need_api_call": False,
                  }

              # 解析成员列表
              members = [m.strip() for m in target_person.replace("、", ",").split(",") if m.strip()]
              if receivedName and receivedName not in members:
                  members.insert(0, receivedName)

              return {
                  "reply_text": f"已创建群「{target_group}」并邀请 {', '.join(members)} 加入，指令已下发。",
                  "need_api_call": True,
                  "api_url": f"{apiBaseUrl.rstrip('/')}/wework/sendRawMessage?robotId={robotId}",
                  "api_body": json.dumps({
                      "socketType": 2,
