app:
  description: WorkTool 操作子工作流 — 接收主工作流传来的意图与实体，构建并执行加好友/拉人/建群等 WorkTool 指令，返回最终回复文本
    reply_text。
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 子工作流-WORKTOOL_OP
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: WorkTool API 基础地址
    id: env_api_base_url
    name: WT_API_BASE_URL
    selector:
    - env
    - WT_API_BASE_URL
    value: https://api.worktool.ymdyes.cn
    value_type: string
  - description: 机器人 ID
    id: env_robot_id
    name: WT_ROBOT_ID
    selector:
    - env
    - WT_ROBOT_ID
    value: wtgxpt9udc4pb4hgj0rnn139gfwcc6ls
    value_type: string
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: WorkTool 操作子工作流已就绪。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: if-else
