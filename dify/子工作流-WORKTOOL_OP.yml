    - data:
        code: "import json\nimport re\n\ndef main(\n    target_phone: str,\n    target_person:\
          \ str,\n    spoken: str,\n    robotId: str,\n    apiBaseUrl: str,\n):\n\
          \    \"\"\"\n    构建加好友的 API 请求参数（type=213）。\n    手机号优先取实体，其次从 spoken 中正则提取。\n\
          \    \"\"\"\n    phone_re = re.compile(r\"1[3-9]\\d{9}\")\n\n    if not\
          \ target_phone:\n        m = phone_re.search(spoken or \"\")\n        if\
          \ m:\n            target_phone = m.group(0)\n\n    if not target_phone:\n\
          \        return {\n            \"api_body\": \"\",\n            \"api_url\"\
          : \"\",\n            \"reply_text\": \"请问要添加的好友手机号是多少？\",\n            \"\
          need_api_call\": False,\n        }\n\n    mark_name = target_person or target_phone\n\
          \    return {\n        \"reply_text\": f\"已提交加好友申请（{mark_name}，{target_phone}），请等待对方通过。\"\
          ,\n        \"need_api_call\": True,\n        \"api_url\": f\"{apiBaseUrl.rstrip('/')}/wework/sendRawMessage?robotId={robotId}\"\
          ,\n        \"api_body\": json.dumps({\n            \"socketType\": 2,\n\
          \            \"list\": [\n                {\n                    \"type\"\
          : 213,\n                    \"friend\": {\n                        \"phone\"\
          : target_phone,\n                        \"markName\": mark_name,\n    \
          \                    \"leavingMsg\": \"你好，我是机器人助理~\",\n                \
          \    },\n                }\n            ],\n        }, ensure_ascii=False),\n\
          \    }\n"
