          \            \"reply_text\": \"请问需要邀请谁加入群呢？请提供姓名、手机号或微信号。\",\n         \
          \   \"need_api_call\": False,\n            \"api_body\": \"\",\n       \
          \     \"api_url\": \"\",\n        }\n\n    # 没指定目标群 → 追问\n    if not target_group:\n\
          \        members_str = f\"（成员：{target_person}）\" if target_person else \"\
