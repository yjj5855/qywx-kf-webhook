    - data:
        code: |
          import json

          # 意图 → 大类映射（模型未输出 category 时兜底推导）
          CATEGORY_MAP = {
              "ADD_FRIEND": "WORKTOOL_OP",
              "ADD_MEMBER": "WORKTOOL_OP",
              "CREATE_GROUP": "WORKTOOL_OP",
              "CUSTOMER_SERVICE_QA": "QA",
              "COMPANY_INFO_QUERY": "COMPANY_QUERY",
          }

          def main(llm_output, confidence_threshold: float):
              """
              解析意图 LLM 返回的 JSON，校验置信度阈值并推导大类。
              llm_output 可能是 JSON 字符串（可能带思考标签），也可能是已解析的 dict。
              """
              default = {
                  "intent": "UNKNOWN",
                  "confidence": 0.0,
                  "target_person": "",
                  "target_group": "",
                  "target_phone": "",
                  "query_type": "",
                  "keyword": "",
                  "period": "",
                  "category": "UNKNOWN",
              }

              if not llm_output:
                  return default

              try:
                  if isinstance(llm_output, dict):
                      data = llm_output
                  else:
                      import re

                      raw = str(llm_output)
                      raw = re.sub(r"<thinking>.*?</thinking>", "", raw, flags=re.S)
                      raw = re.sub(r"<think>.*?</think>", "", raw, flags=re.S)
                      data = json.loads(raw.strip())
                  if not isinstance(data, dict):
                      data = default

                  intent_str = str(data.get("intent", "UNKNOWN")).upper().strip()
                  try:
                      confidence = float(data.get("confidence", 0.0) or 0.0)
                  except (TypeError, ValueError):
                      confidence = 0.0
                  target_person = str(data.get("target_person", ""))
                  target_group = str(data.get("target_group", ""))
                  target_phone = str(data.get("target_phone", ""))
                  query_type = str(data.get("query_type", "")).strip().lower()
                  keyword = str(data.get("keyword", ""))
                  period = str(data.get("period", ""))

                  # 置信度低于阈值 → UNKNOWN
                  if confidence < confidence_threshold:
                      intent_str = "UNKNOWN"
                      confidence = 0.0

                  # 兼容别名，统一意图名
                  if intent_str in ("QA", "CUSTOMER_QA", "CUSTOMER_SERVICE", "QA_QUESTION"):
                      intent_str = "CUSTOMER_SERVICE_QA"
                  if intent_str in ("COMPANY_QUERY", "COMPANY_INFO", "QUERY_COMPANY"):
                      intent_str = "COMPANY_INFO_QUERY"

                  # 大类：优先取模型输出，非法值则按意图推导
                  category = str(data.get("category", "")).strip().upper()
                  if category not in CATEGORY_MAP.values():
                      category = CATEGORY_MAP.get(intent_str, "UNKNOWN")

                  return {
                      "intent": intent_str,
                      "confidence": min(max(confidence, 0.0), 1.0),
                      "target_person": target_person,
                      "target_group": target_group,
                      "target_phone": target_phone,
                      "query_type": query_type,
                      "keyword": keyword,
                      "period": period,
                      "category": category,
                  }
              except (json.JSONDecodeError, ValueError, TypeError):
                  # 降级：纯文本匹配
                  text_upper = str(llm_output).strip().upper()
                  if "CREATE_GROUP" in text_upper:
                      return {**default, "intent": "CREATE_GROUP", "confidence": 0.9, "category": "WORKTOOL_OP"}
                  if "ADD_MEMBER" in text_upper:
                      return {**default, "intent": "ADD_MEMBER", "confidence": 0.9, "category": "WORKTOOL_OP"}
                  if "ADD_FRIEND" in text_upper:
                      return {**default, "intent": "ADD_FRIEND", "confidence": 0.9, "category": "WORKTOOL_OP"}
                  return default
        code_language: python3
        desc: ''
        isInIteration: false
        isInLoop: false
        outputs:
          category:
            children: null
            type: string
          confidence:
            children: null
            type: number
          intent:
            children: null
            type: string
          keyword:
            children: null
            type: string
          period:
            children: null
            type: string
          query_type:
            children: null
            type: string
          target_group:
            children: null
            type: string
          target_person:
            children: null
            type: string
          target_phone:
            children: null
            type: string
