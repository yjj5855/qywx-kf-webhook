        prompt_config:
          jinja2_variables: []
        prompt_template:
        - id: prompt_gate_system
          role: system
          text: |-
            你是群聊回复门控器。请判断最后一条消息是否应由机器人在群聊公开回复。

            规则：如果最后一条消息意图是建群、拉人进群、添加好友、查询公司信息（员工/账单/财务/人事/社保公积金等），或是对机器人的客服提问（咨询业务、产品、服务等问题），则返回 YES；
            如果更像成员间闲聊、互相对话、与机器人无关，则返回 NO。

            输出要求：最后一行只输出 YES 或 NO（思考过程可以写在 <thinking> 标签里，但最终判定必须单独一行）。
        - id: prompt_gate_user
          role: user
          text: |-
            群名：{{#code_validate.groupRemark#}} 或 {{#code_validate.groupName#}}
            发送者：{{#code_validate.receivedName#}}
            最后一条消息：{{#code_validate.gate_msg#}}
        reasoning_format: tagged
        selected: false
        structured_output: null
        structured_output_switch_on: false
        title: AI 门控判断
        type: llm
        variables: []
        vision:
          enabled: false
      height: 88
      id: llm_gate
      position:
        x: 1260
        y: 140
      positionAbsolute:
        x: 1260
        y: 140
      selected: false
      type: custom
      width: 242
      zIndex: 0
    - data:
        code: |
          import re

          def main(llm_text: str):
              """归一化门控 LLM 输出：去掉思考标签，取最后一个非空行判定 YES/NO。"""
              if not llm_text:
                  return {"gate_pass": False, "gate_raw": ""}
              text = llm_text.strip()
              # 去掉思考块（兼容 <thinking> 与 <think> 标签）
              text = re.sub(r"<thinking>.*?</thinking>", "", text, flags=re.S)
              text = re.sub(r"<think>.*?</think>", "", text, flags=re.S)
              text = text.strip()
              lines = [ln.strip() for ln in text.splitlines() if ln.strip()]
              last = (lines[-1] if lines else text).upper()
              return {
                  "gate_pass": last == "YES" or last.startswith("YES"),
                  "gate_raw": text,
              }
        code_language: python3
        outputs:
          gate_pass:
            children: null
            type: boolean
          gate_raw:
            children: null
            type: string
        selected: false
        title: 门控结果归一化
        type: code
        variables:
        - value_selector:
          - llm_gate
          - text
          value_type: string
          variable: llm_text
      height: 52
      id: code_gate_normalize
      position:
